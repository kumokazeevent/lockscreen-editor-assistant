<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锁屏编辑助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">锁</div>
        <div>
          <h1>锁屏编辑助手</h1>
          <p id="pageStatus">标题审核 · 图片快搜</p>
        </div>
        <button id="readPage" class="icon-button" type="button" title="读取当前页面">↻</button>
      </header>

      <section class="editor-card" aria-labelledby="copyHeading">
        <div class="section-heading">
          <h2 id="copyHeading">文案审核</h2>
          <span class="rule-note">自动截断超出内容</span>
        </div>

        <label class="field-label" for="titleInput">
          <span>标题</span>
          <span id="titleCount" class="counter">0 / 12</span>
        </label>
        <input id="titleInput" class="text-input title-input" type="text" placeholder="输入或从页面读取标题" autocomplete="off" />

        <label class="field-label summary-label" for="summaryInput">
          <span>简介</span>
          <span id="summaryCount" class="counter">0 / 50</span>
        </label>
        <textarea id="summaryInput" class="text-input summary-input" rows="3" placeholder="输入不超过 50 字的简介"></textarea>

        <div class="action-row">
          <button id="applyDraft" class="primary-button" type="button">填写到后台</button>
          <button id="copyDraft" class="secondary-button" type="button">复制成稿</button>
        </div>
      </section>

      <section class="search-card" aria-labelledby="searchHeading">
        <div class="section-heading">
          <h2 id="searchHeading">配图搜索</h2>
          <button id="refreshKeywords" class="text-button" type="button">重新推荐</button>
        </div>
        <p class="helper-text">点选关键词组合搜索，也可直接修改搜索词。</p>
        <div id="keywordChips" class="keyword-chips" aria-live="polite"></div>
        <input id="searchQuery" class="text-input search-input" type="text" placeholder="输入图片搜索词" autocomplete="off" />
        <div class="engine-row">
          <button class="engine-button baidu" data-engine="baidu" type="button">百度图片</button>
          <button class="engine-button bing" data-engine="bing" type="button">必应图片</button>
          <button class="engine-button google" data-engine="google" type="button">Google</button>
        </div>
      </section>

      <section class="page-tools" aria-label="网页工具">
        <button id="replaceMode" class="tool-button" type="button">
          <span class="tool-icon">▧</span>
          <span><strong>进入换图模式</strong><small>在页面上点选图片并预览</small></span>
        </button>
        <button id="bindFields" class="tool-button" type="button">
          <span class="tool-icon">⌁</span>
          <span><strong>绑定后台字段</strong><small>首次使用当前网站时设置</small></span>
        </button>
      </section>

      <footer>
        <span id="saveState">草稿自动保存</span>
        <button id="openOptions" class="text-button" type="button">设置与站点绑定</button>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
